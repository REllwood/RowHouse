name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1); fi
          sudo xcode-select -s "$XCODE"
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package app bundle
        run: CONFIG=debug scripts/build-app.sh
